<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="09 · 专注模式保持安静"><title>focus-mode / 09 · 专注模式保持安静</title><desc>交互提案。等待和失败标记持久保留。；与现状区别：新方案的专注模式也抑制等待、失败和执行中的自动扩张。；静音到期只更新安静状态，不抢焦点。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#E4E7EB" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">09 · 专注模式保持安静</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#23262B" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#A2AAB5" text-anchor="middle">交互提案</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">开启专注模式或静音 1 小时</text><circle cx="40" cy="140" r="10" fill="#181A1D"/><text x="40" y="144" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">继续接收并保存任务状态</text><path d="M40 152H40V164" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="176" r="10" fill="#181A1D"/><text x="40" y="180" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">2</text><text x="62" y="180" font-size="13" font-weight="400" fill="#435364" text-anchor="start">全部自动摘要保持收起，仅更新静态标记</text><path d="M40 188H40V200" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="212" r="10" fill="#181A1D"/><text x="40" y="216" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">3</text><text x="62" y="216" font-size="13" font-weight="400" fill="#435364" text-anchor="start">主动点击仍可查看并处理任务</text><text x="28" y="260" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="260" font-size="12" font-weight="400" fill="#435364" text-anchor="start">退出专注或静音到期后恢复后续提醒，不补播积压动画。</text><text x="28" y="297" font-size="11" font-weight="400" fill="#667785" text-anchor="start">等待和失败标记持久保留。</text></svg>