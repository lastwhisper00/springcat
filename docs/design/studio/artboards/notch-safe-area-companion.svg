<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="14 · 刘海下方安全展开"><title>notch-safe-area / 14 · 刘海下方安全展开</title><desc>交互提案。摄像头区域不放文字、按钮和命中区域。；自动隐藏菜单栏出现时重新避让。；已有兼容布局设置；最终安全区与系统行为需 macOS 实机验证。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#DEE4EA" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">14 · 刘海下方安全展开</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#232E3B" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#A5B2C2" text-anchor="middle">交互提案</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">在有刘海的 Mac 开启刘海兼容布局</text><circle cx="40" cy="140" r="10" fill="#19212B"/><text x="40" y="144" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">依据实际屏幕安全区域确定中心与下缘</text><path d="M40 152H40V164" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="176" r="10" fill="#19212B"/><text x="40" y="180" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">2</text><text x="62" y="180" font-size="13" font-weight="400" fill="#435364" text-anchor="start">静止外壳可融入黑色刘海，下方保留可发现入口</text><path d="M40 188H40V200" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="212" r="10" fill="#19212B"/><text x="40" y="216" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">3</text><text x="62" y="216" font-size="13" font-weight="400" fill="#435364" text-anchor="start">全部文字和操作从硬件区域下方出现</text><text x="28" y="260" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="260" font-size="12" font-weight="400" fill="#435364" text-anchor="start">收回刘海下沿；菜单栏或键盘入口仍可访问。</text><text x="28" y="297" font-size="11" font-weight="400" fill="#667785" text-anchor="start">摄像头区域不放文字、按钮和命中区域。</text></svg>