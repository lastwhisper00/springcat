<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="15 · 侧边始终向内展开"><title>side-docking / 15 · 侧边始终向内展开</title><desc>交互提案。文字保持正常方向，不随左右模式镜像。；边缘保留可点击面积，不把球藏到屏幕外。；默认五条任务同屏；高度不足时分页提供上一页、下一页与总数，更多任务仍可进入完整工作台。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#E8EBEF" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">15 · 侧边始终向内展开</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#F0F2F5" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#626C79" text-anchor="middle">交互提案</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">停靠左侧或右侧</text><circle cx="40" cy="140" r="10" fill="#FAFBFC"/><text x="40" y="144" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">小球保持在贴边位置</text><path d="M40 152H40V164" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="176" r="10" fill="#FAFBFC"/><text x="40" y="180" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">2</text><text x="62" y="180" font-size="13" font-weight="400" fill="#435364" text-anchor="start">左侧向右展开，右侧向左展开；展开宽度默认 520</text><path d="M40 188H40V200" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="212" r="10" fill="#FAFBFC"/><text x="40" y="216" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">3</text><text x="62" y="216" font-size="13" font-weight="400" fill="#435364" text-anchor="start">空间不足时先让整个展开面板向内或上下避让；仍受限时适配宽度、紧凑摘要或明确分页，不裁剪内容</text><text x="28" y="260" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="260" font-size="12" font-weight="400" fill="#435364" text-anchor="start">外壳收回原球心；不横穿整张展开面板。</text><text x="28" y="297" font-size="11" font-weight="400" fill="#667785" text-anchor="start">文字保持正常方向，不随左右模式镜像。</text></svg>