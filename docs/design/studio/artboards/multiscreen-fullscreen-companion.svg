<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="16 · 多屏与全屏"><title>multiscreen-fullscreen / 16 · 多屏与全屏</title><desc>交互提案。跨 DPI 缩放时保持逻辑尺寸。；全屏、Spaces 与独占全屏覆盖能力必须做原生验证。；不复制成多个重复发声的入口。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#DEE4EA" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">16 · 多屏与全屏</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#232E3B" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#A5B2C2" text-anchor="middle">交互提案</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">跨屏拖动、显示器断开或进入全屏应用</text><circle cx="40" cy="140" r="10" fill="#19212B"/><text x="40" y="144" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">跨屏时预览目标屏幕的实际工作区</text><path d="M40 152H40V164" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="176" r="10" fill="#19212B"/><text x="40" y="180" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">2</text><text x="62" y="180" font-size="13" font-weight="400" fill="#435364" text-anchor="start">按屏幕分别保存停靠位置和比例</text><path d="M40 188H40V200" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="212" r="10" fill="#19212B"/><text x="40" y="216" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">3</text><text x="62" y="216" font-size="13" font-weight="400" fill="#435364" text-anchor="start">全屏场景默认不自动扩张，允许用户主动唤出</text><text x="28" y="260" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="260" font-size="12" font-weight="400" fill="#435364" text-anchor="start">屏幕断开时迁回主屏可见位置；退出全屏恢复位置。</text><text x="28" y="297" font-size="11" font-weight="400" fill="#667785" text-anchor="start">跨 DPI 缩放时保持逻辑尺寸。</text></svg>