<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="08 · 等待与失败持续可找"><title>attention-reminder / 08 · 等待与失败持续可找</title><desc>交互提案。标记已读仅清除未读，不代表任务已解决。；不在监听器中提供伪造的授权按钮；操作为返回对话。；失败不持续闪烁、不强制打开展开面板。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#E8EBEF" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">08 · 等待与失败持续可找</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#F0F2F5" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#626C79" text-anchor="middle">交互提案</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">任务需要处理或执行失败</text><circle cx="40" cy="140" r="10" fill="#FAFBFC"/><text x="40" y="144" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">非专注状态下出现一条简短摘要</text><path d="M40 152H40V164" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="176" r="10" fill="#FAFBFC"/><text x="40" y="180" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">2</text><text x="62" y="180" font-size="13" font-weight="400" fill="#435364" text-anchor="start">收回摘要后仍保留待处理数量</text><path d="M40 188H40V200" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="212" r="10" fill="#FAFBFC"/><text x="40" y="216" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">3</text><text x="62" y="216" font-size="13" font-weight="400" fill="#435364" text-anchor="start">主动展开后，在统一任务列表中查看待确认或失败状态；点击对应行进入详情</text><text x="28" y="260" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="260" font-size="12" font-weight="400" fill="#435364" text-anchor="start">任务恢复、被处理或用户明确归档后移除待处理标记。</text><text x="28" y="297" font-size="11" font-weight="400" fill="#667785" text-anchor="start">标记已读仅清除未读，不代表任务已解决。</text></svg>