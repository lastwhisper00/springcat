<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="01 · 四个位置，同一套形态"><title>resting-forms / 01 · 四个位置，同一套形态</title><desc>交互提案。自由浮动是提案；当前持久化停靠方向仅有顶部、左侧和右侧。；位置改变不改变任务状态和未读数；顶部、侧球、摘要与刘海下沿使用同一执行亮灭语义。6 pt 刘海静默下沿只显示 4 pt 光点，悬停或展开再显示完整来源 Logo。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#DEE4EA" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">01 · 四个位置，同一套形态</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#232E3B" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#A5B2C2" text-anchor="middle">交互提案</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">首次定位或更换停靠方式</text><circle cx="40" cy="140" r="10" fill="#19212B"/><text x="40" y="144" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">普通顶部：紧凑胶囊 → 摘要胶囊 → 向下展开面板</text><path d="M40 152H40V164" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="176" r="10" fill="#19212B"/><text x="40" y="180" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">2</text><text x="62" y="180" font-size="13" font-weight="400" fill="#435364" text-anchor="start">刘海下方：可见下沿 → 下方摘要 → 向下展开面板</text><path d="M40 188H40V200" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="212" r="10" fill="#19212B"/><text x="40" y="216" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">3</text><text x="62" y="216" font-size="13" font-weight="400" fill="#435364" text-anchor="start">左右侧边：小球 → 向内胶囊 → 向内展开面板</text><path d="M40 224H40V236" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="248" r="10" fill="#19212B"/><text x="40" y="252" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">4</text><text x="62" y="252" font-size="13" font-weight="400" fill="#435364" text-anchor="start">自由浮动：小球 → 摘要 → 避让屏幕边界的展开面板</text><text x="28" y="296" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="296" font-size="12" font-weight="400" fill="#435364" text-anchor="start">返回当前停靠位置的常驻形态。</text><text x="28" y="333" font-size="11" font-weight="400" fill="#667785" text-anchor="start">自由浮动是提案；当前持久化停靠方向仅有顶部、左侧和右侧。</text></svg>