<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="处理中、成功与失败反馈"><title>style-feedback / 处理中、成功与失败反馈</title><desc>已有能力 / 新样式。状态反馈不能掩盖结果，也不能把未完成的操作报为成功。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="800" height="500" rx="0" fill="#E8EBEF" stroke="none"/><text x="30" y="41" font-size="22" font-weight="500" fill="#344250" text-anchor="start">处理中、成功与失败反馈</text><rect x="28" y="84" width="358" height="99" rx="8" fill="#FAFBFC" stroke="none"/><circle cx="48" cy="109" r="3" fill="#426B55"/><text x="60" y="113" font-size="13" font-weight="500" fill="#20252C" text-anchor="start">生成中</text><text x="44" y="140" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">正在生成用量图片…</text><text x="44" y="164" font-size="11" font-weight="400" fill="#2F5F9D" text-anchor="start">请稍候，可取消</text><rect x="414" y="84" width="358" height="99" rx="8" fill="#FAFBFC" stroke="none"/><circle cx="434" cy="109" r="3" fill="#426B55"/><text x="446" y="113" font-size="13" font-weight="500" fill="#20252C" text-anchor="start">复制成功</text><text x="430" y="140" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">图片已复制</text><text x="430" y="164" font-size="11" font-weight="400" fill="#2F5F9D" text-anchor="start">可粘贴到目标应用</text><rect x="28" y="204" width="358" height="99" rx="8" fill="#FAFBFC" stroke="none"/><circle cx="48" cy="229" r="3" fill="#A3464B"/><text x="60" y="233" font-size="13" font-weight="500" fill="#20252C" text-anchor="start">复制失败</text><text x="44" y="260" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">系统未能复制图片</text><text x="44" y="284" font-size="11" font-weight="400" fill="#2F5F9D" text-anchor="start">改为保存 PNG</text><rect x="414" y="204" width="358" height="99" rx="8" fill="#FAFBFC" stroke="none"/><circle cx="434" cy="229" r="3" fill="#426B55"/><text x="446" y="233" font-size="13" font-weight="500" fill="#20252C" text-anchor="start">保存成功</text><text x="430" y="260" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">已保存到所选目录</text><text x="430" y="284" font-size="11" font-weight="400" fill="#2F5F9D" text-anchor="start">打开所在目录</text><rect x="28" y="324" width="358" height="99" rx="8" fill="#FAFBFC" stroke="none"/><circle cx="48" cy="349" r="3" fill="#A3464B"/><text x="60" y="353" font-size="13" font-weight="500" fill="#20252C" text-anchor="start">保存失败</text><text x="44" y="380" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">当前目录不可写入</text><text x="44" y="404" font-size="11" font-weight="400" fill="#2F5F9D" text-anchor="start">重新选择目录</text><rect x="414" y="324" width="358" height="99" rx="8" fill="#FAFBFC" stroke="none"/><circle cx="434" cy="349" r="3" fill="#426B55"/><text x="446" y="353" font-size="13" font-weight="500" fill="#20252C" text-anchor="start">连接测试成功</text><text x="430" y="380" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">已收到测试事件</text><text x="430" y="404" font-size="11" font-weight="400" fill="#2F5F9D" text-anchor="start">连接可以使用</text><text x="28" y="478" font-size="12" font-weight="400" fill="#536171" text-anchor="start">反馈紧邻触发动作；失败保留原内容与恢复入口。</text></svg>