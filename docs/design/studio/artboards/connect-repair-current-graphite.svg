<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="18 · 已有工具绑定与修复"><title>connect-repair-current / 18 · 已有工具绑定与修复</title><desc>已有能力。只读监听工具与 hook 工具使用不同接入方式。；安装失败展示错误；适用工具提供手动绑定说明。；README 记载启动时检查并修复已启用绑定。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#E4E7EB" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">18 · 已有工具绑定与修复</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#23262B" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#A2AAB5" text-anchor="middle">已有能力</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">设置 → AI 工具</text><circle cx="40" cy="140" r="10" fill="#181A1D"/><text x="40" y="144" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">选择工具并启用监听</text><path d="M40 152H40V164" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="176" r="10" fill="#181A1D"/><text x="40" y="180" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">2</text><text x="62" y="180" font-size="13" font-weight="400" fill="#435364" text-anchor="start">安装或修复对应绑定</text><path d="M40 188H40V200" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="212" r="10" fill="#181A1D"/><text x="40" y="216" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">3</text><text x="62" y="216" font-size="13" font-weight="400" fill="#435364" text-anchor="start">发送测试事件并检查结果</text><text x="28" y="260" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="260" font-size="12" font-weight="400" fill="#435364" text-anchor="start"