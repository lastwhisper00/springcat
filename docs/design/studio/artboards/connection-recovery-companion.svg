<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="19 · 连接异常可以恢复"><title>connection-recovery / 19 · 连接异常可以恢复</title><desc>交互提案。长时间没有新任务不等于连接断开。；保留其他工具的配置与已有任务历史。；统一连接卡片和恢复反馈是重设计提案。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#DEE4EA" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">19 · 连接异常可以恢复</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#232E3B" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#A5B2C2" text-anchor="middle">交互提案</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">绑定缺失、测试失败或数据读取异常</text><circle cx="40" cy="140" r="10" fill="#19212B"/><text x="40" y="144" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">连接卡片展示具体原因和最后检查时间</text><path d="M40 152H40V164" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="176" r="10" fill="#19212B"/><text x="40" y="180" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">2</text><text x="62" y="180" font-size="13" font-weight="400" fill="#435364" text-anchor="start">用户点击修复，显示进行中并防止重复提交</text><path d="M40 188H40V200" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="212" r="10" fill="#19212B"/><text x="40" y="216" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">3</text><text x="62" y="216" font-size="13" font-weight="400" fill="#435364" text-anchor="start">修复后重新测试，成功恢复已连接状态</text><text x="28" y="260" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="260" font-size="12" font-weight="400" fill="#435364" text-anchor="start">失败保留诊断与重试；成功后用户自行关闭连接页。</text><text x="28" y="297" font-size="11" font-weight="400" fill="#667785" text-anchor="start">长时间没有新任务不等于连接断开。</text></svg>