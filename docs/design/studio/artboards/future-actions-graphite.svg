<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="23 · 未来功能共用入口"><title>future-actions / 23 · 未来功能共用入口</title><desc>交互提案。快速记录、工作流与宠物能力属于未来规划。；监听权限不等于可在源工具内执行或批准操作。；长内容进入独立工作台；空间不足时使用清晰分页或页面入口，不能靠缩小字号或隐藏滚动条处理溢出。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#E4E7EB" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">23 · 未来功能共用入口</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#23262B" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#A2AAB5" text-anchor="middle">交互提案</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">查看动作入口或桌面伴侣预览</text><circle cx="40" cy="140" r="10" fill="#181A1D"/><text x="40" y="144" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">未来动作集中在展开面板的独立分区，只显示可完整阅读的少量动作</text><path d="M40 152H40V164" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="176" r="10" fill="#181A1D"/><text x="40" y="180" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">2</text><text x="62" y="180" font-size="13" font-weight="400" fill="#435364" text-anchor="start">未实现能力显示规划中，不提供伪执行反馈；详情与回顾沿用宽裕的同宽布局，长说明转独立页面</text><path d="M40 188H40V200" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="212" r="10" fill="#181A1D"/><text x="40" y="216" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">3</text><text x="62" y="216" font-size="13" font-weight="400" fill="#435364" text-anchor="start">能力上线后仍共用当前停靠与通知规则，动作、详情与回顾不使用嵌套滚动</text><text x="28" y="260" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="260" font-size="12" font-weight="400" fill="#435364" text-anchor="start">返回动态页；常驻胶囊体积不随功能增加。</text><text x="28" y="297" font-size="11" font-weight="400" fill="#667785" text-anchor="start">快速记录、工作流与宠物能力属于未来规划。</text></svg>