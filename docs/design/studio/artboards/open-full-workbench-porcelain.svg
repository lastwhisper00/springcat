<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="24 · 进入完整工作台"><title>open-full-workbench / 24 · 进入完整工作台</title><desc>交互提案。工作台已打开时聚焦已有窗口，不重复创建。；展开面板默认宽 520、五条任务时高约 470，左右内边距各 24；完整工作台是独立窗口，两者不共用关闭语义。；统一工作台与查看全部任务、↗ 入口为提案；当前已有独立设置和用量页面。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#E8EBEF" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">24 · 进入完整工作台</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#F0F2F5" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#626C79" text-anchor="middle">交互提案</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">点击查看全部任务，或展开面板右上角 ↗</text><circle cx="40" cy="140" r="10" fill="#FAFBFC"/><text x="40" y="144" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">在独立大窗口打开完整工作台</text><path d="M40 152H40V164" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="176" r="10" fill="#FAFBFC"/><text x="40" y="180" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">2</text><text x="62" y="180" font-size="13" font-weight="400" fill="#435364" text-anchor="start">承接当前任务上下文，并容纳完整任务列表、历史、用量、设置与长说明；长内容使用单一主阅读区滚动</text><path d="M40 188H40V200" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="212" r="10" fill="#FAFBFC"/><text x="40" y="216" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">3</text><text x="62" y="216" font-size="13" font-weight="400" fill="#435364" text-anchor="start">常驻入口回到紧凑形态，继续显示任务状态</text><text x="28" y="260" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="260" font-size="12" font-weight="400" fill="#435364" text-anchor="start">关闭大窗只关闭工作台，不退出常驻入口与后台监听。</text><text x="28" y="297" font-size="11" font-weight="400" fill="#667785" text-anchor="start">工作台已打开时聚焦已有窗口，不重复创建。</text></svg>