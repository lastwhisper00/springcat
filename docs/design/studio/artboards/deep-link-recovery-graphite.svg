<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="20 · 返回对话与跳转失败"><title>deep-link-recovery / 20 · 返回对话与跳转失败</title><desc>交互提案。没有 deep link 时明确显示打开来源应用。；不能跳转时不声称已打开。；已有任务跳转能力；清晰的失败反馈与替代路径为提案。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#E4E7EB" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">20 · 返回对话与跳转失败</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#23262B" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#A2AAB5" text-anchor="middle">交互提案</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">任务详情 → 返回对话</text><circle cx="40" cy="140" r="10" fill="#181A1D"/><text x="40" y="144" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">优先使用任务提供的 deep link</text><path d="M40 152H40V164" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="176" r="10" fill="#181A1D"/><text x="40" y="180" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">2</text><text x="62" y="180" font-size="13" font-weight="400" fill="#435364" text-anchor="start">无法定位时提示并提供打开来源应用</text><path d="M40 188H40V200" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="212" r="10" fill="#181A1D"/><text x="40" y="216" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">3</text><text x="62" y="216" font-size="13" font-weight="400" fill="#435364" text-anchor="start">仍失败则保留任务信息与重试入口</text><text x="28" y="260" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="260" font-size="12" font-weight="400" fill="#435364" text-anchor="start">跳转成功不删除任务；用户回到展开面板仍能找到原记录。</text><text x="28" y="297" font-size="11" font-weight="400" fill="#667785" text-anchor="start">没有 deep link 时明确显示打开来源应用。</text></svg>