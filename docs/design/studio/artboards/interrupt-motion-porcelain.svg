<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="04 · 动画可以随时反向"><title>interrupt-motion / 04 · 动画可以随时反向</title><desc>交互提案。第二次点击不得丢弃。；展开约 300–380 ms；收起约 220–280 ms，均为调试范围。；减少动态效果时取消空间变形。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#E8EBEF" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">04 · 动画可以随时反向</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#F0F2F5" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#626C79" text-anchor="middle">交互提案</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">展开途中再次收起，或收起途中再次打开</text><circle cx="40" cy="140" r="10" fill="#FAFBFC"/><text x="40" y="144" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">读取当前外壳位置、尺寸与运动速度</text><path d="M40 152H40V164" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="176" r="10" fill="#FAFBFC"/><text x="40" y="180" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">2</text><text x="62" y="180" font-size="13" font-weight="400" fill="#435364" text-anchor="start">立即更新目标状态</text><path d="M40 188H40V200" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="212" r="10" fill="#FAFBFC"/><text x="40" y="216" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">3</text><text x="62" y="216" font-size="13" font-weight="400" fill="#435364" text-anchor="start">从当前几何状态继续运动，内容独立淡入淡出</text><text x="28" y="260" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="260" font-size="12" font-weight="400" fill="#435364" text-anchor="start">最终停在最后一次有效操作指定的状态。</text><text x="28" y="297" font-size="11" font-weight="400" fill="#667785" text-anchor="start">第二次点击不得丢弃。</text></svg>