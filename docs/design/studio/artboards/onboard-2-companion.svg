<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510" role="img" aria-label="连接第一个工具"><title>onboard-2 / 连接第一个工具</title><desc>设计补齐。当前版本没有首次使用向导，这组是新增设计。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="720" height="510" rx="18" fill="#19212B" stroke="#3B4A5C"/><g transform="translate(38 32) scale(1)" aria-label="SpringCat 状态标识"><path d="M6 13V26M16 5V26M26 10V26" stroke="#EFF3F7" stroke-width="3" fill="none"/></g><text x="83" y="56" font-size="19" font-weight="500" fill="#EFF3F7" text-anchor="start">SpringCat</text><text x="677" y="53" font-size="12" font-weight="400" fill="#A5B2C2" text-anchor="end">跳过</text><circle cx="55" cy="101" r="11" fill="#232E3B"/><text x="55" y="105" font-size="11" font-weight="500" fill="#A5B2C2" text-anchor="middle">1</text><text x="75" y="106" font-size="12" font-weight="400" fill="#A5B2C2" text-anchor="start">认识 SpringCat</text><circle cx="229" cy="101" r="11" fill="#232E3B"/><text x="229" y="105" font-size="11" font-weight="500" fill="#A5B2C2" text-anchor="middle">2</text><text x="249" y="106" font-size="12" font-weight="400" fill="#A5B2C2" text-anchor="start">选择位置</text><circle cx="403" cy="101" r="11" fill="#94B5E0"/><text x="403" y="105" font-size="11" font-weight="500" fill="#19212B" text-anchor="middle">3</text><text x="423" y="106" font-size="12" font-weight="400" fill="#EFF3F7" text-anchor="start">连接工具</text><circle cx="577" cy="101" r="11" fill="#232E3B"/><text x="577" y="105" font-size="11" font-weight="500" fill="#A5B2C2" text-anchor="middle">4</text><text x="597" y="106" font-size="12" font-weight="400" fill="#A5B2C2" text-anchor="start">测试提醒</text><text x="48" y="178" font-size="25" font-weight="500" fill="#EFF3F7" text-anchor="start">先连接一个常用工具</text><rect x="48" y="201" width="622" height="44" rx="8" fill="#232E3B" stroke="none"/><text x="67" y="228" font-size="14" font-weight="500" fill="#EFF3F7" text-anchor="start">Codex</text><text x="649" y="228" font-size="12" font-weight="400" fill="#9CBBAE" text-anchor="end">已选择</text><rect x="48" y="255" width="622" height="44" rx="8" fill="#232E3B" stroke="none"/><text x="67" y="282" font-size="14" font-weight="500" fill="#EFF3F7" text-anchor="start">Cursor</text><text x="649" y="282" font-size="12" font-weight="400" fill="#A5B2C2" text-anchor="end">连接</text><rect x="48" y="309" width="622" height="44" rx="8" fill="#232E3B" stroke="none"/><text x="67" y="336" font-size="14" font-weight="500" fill="#EFF3F7" text-anchor="start">Gemini CLI</text><text x="649" y="336" font-size="12" font-weight="400" fill="#A5B2C2" text-anchor="end">连接</text><text x="48" y="396" font-size="13" font-weight="400" fill="#A5B2C2" text-anchor="start">你可以稍后在设置中连接全部 8 个来源。</text><path d="M38 437H682V437" stroke="#3B4A5C" fill="none"/><text x="48" y="473" font-size="12" font-weight="400" fill="#A5B2C2" text-anchor="start">首次使用向导 · 新增设计</text><rect x="559" y="450" width="112" height="28" rx="6" fill="#232E3B" stroke="none"/><text x="615" y="469" font-size="13" font-weight="500" fill="#94B5E0" text-anchor="middle">继续</text></svg>