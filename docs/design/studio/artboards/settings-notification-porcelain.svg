<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" role="img" aria-label="通知与专注"><title>settings-notification / 通知与专注</title><desc>已有能力 / 新样式。hook 工具和只读监听工具的配置路径不同；保留原有第三方配置。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="860" height="620" rx="16" fill="#FAFBFC" stroke="#D9DEE5"/><rect x="0" y="0" width="165" height="620" rx="8" fill="#F0F2F5" stroke="none"/><rect x="145" y="0" width="20" height="620" rx="0" fill="#F0F2F5" stroke="none"/><circle cx="19" cy="21" r="4" fill="#D7867E"/><circle cx="33" cy="21" r="4" fill="#D6B578"/><circle cx="47" cy="21" r="4" fill="#85B69A"/><g transform="translate(22 51) scale(0.75)" aria-label="SpringCat 状态标识"><path d="M6 13V26M16 5V26M26 10V26" stroke="#20252C" stroke-width="3" fill="none"/></g><text x="58" y="70" font-size="15" font-weight="500" fill="#20252C" text-anchor="start">SpringCat</text><text x="24" y="105" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">动态</text><text x="24" y="145" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">任务历史</text><text x="24" y="185" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">用量与回顾</text><text x="24" y="225" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">AI 工具</text><text x="24" y="265" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">外观与停靠</text><rect x="12" y="284" width="140" height="33" rx="8" fill="#FAFBFC" stroke="none"/><text x="24" y="305" font-size="12" font-weight="500" fill="#20252C" text-anchor="start">通知与专注</text><text x="24" y="345" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">常规与存储</text><text x="24" y="593" font-size="11" font-weight="400" fill="#626C79" text-anchor="start">本地优先 · 设计提案</text><text x="196" y="59" font-size="25" font-weight="500" fill="#20252C" text-anchor="start">通知与专注</text><text x="830" y="29" font-size="13" font-weight="400" fill="#626C79" text-anchor="end">−    ×</text><text x="196" y="119" font-size="14" font-weight="500" fill="#20252C" text-anchor="start">专注模式</text><text x="196" y="142" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">提案：只更新未读标记，不自动展开。</text><rect x="795" y="108" width="34" height="20" rx="10" fill="#2F5F9D" stroke="none"/><circle cx="819" cy="118" r="7" fill="#FAFBFC"/><path d="M196 164H830V164" stroke="#D9DEE5" fill="none"/><text x="196" y="195" font-size="14" font-weight="500" fill="#20252C" text-anchor="start">静音 1 小时</text><text x="196" y="218" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">所有提醒保持安静；手动打开不受影响。</text><text x="830" y="204" font-size="13" font-weight="400" fill="#626C79" text-anchor="end">剩余 58 分钟</text><path d="M196 240H830V240" stroke="#D9DEE5" fill="none"/><text x="196" y="271" font-size="14" font-weight="500" fill="#20252C" text-anchor="start">完成提醒</text><text x="196" y="294" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">合并连续完成，5 秒后回到小体积。</text><text x="830" y="280" font-size="13" font-weight="400" fill="#626C79" text-anchor="end">短暂提示  ›</text><path d="M196 316H830V316" stroke="#D9DEE5" fill="none"/><text x="196" y="347" font-size="14" font-weight="500" fill="#20252C" text-anchor="start">等待与失败</text><text x="196" y="370" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">保留待处理标记，遵守用户手动收起。</text><text x="830" y="356" font-size="13" font-weight="400" fill="#626C79" text-anchor="end">持续标记  ›</text><path d="M196 392H830V392" stroke="#D9DEE5" fill="none"/><text x="196" y="423" font-size="14" font-weight="500" fill="#20252C" text-anchor="start">任务执行时自动置顶</text><text x="196" y="446" font-size="12" font-weight="400" fill="#626C79" text-anchor="start">没有执行任务时恢复原先状态。</text><rect x="795" y="412" width="34" height="20" rx="10" fill="#D9DEE5" stroke="none"/><circle cx="805" cy="422" r="7" fill="#626C79"/><path d="M196 468H830V468" stroke="#D9DEE5" fill="none"/><text x="196" y="531" font-size="12" font-weight="400" fill="#815B21" text-anchor="start">专注策略拟调整；当前版本仅抑制完成时探出。</text></svg>