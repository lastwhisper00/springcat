<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="21 · 用量回顾与手动分享"><title>usage-export / 21 · 用量回顾与手动分享</title><desc>已有能力。复制失败可改为保存 PNG。；保存或生成失败显示原因并允许重试。；仅支持已接入来源的结构化用量；费用是估算。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#DEE4EA" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">21 · 用量回顾与手动分享</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#232E3B" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#A5B2C2" text-anchor="middle">已有能力</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">打开用量日历并选择日、周或月</text><circle cx="40" cy="140" r="10" fill="#19212B"/><text x="40" y="144" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">查看本地汇总、模型分布与费用估算</text><path d="M40 152H40V164" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="176" r="10" fill="#19212B"/><text x="40" y="180" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">2</text><text x="62" y="180" font-size="13" font-weight="400" fill="#435364" text-anchor="start">点击分享战报生成图片预览</text><path d="M40 188H40V200" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="212" r="10" fill="#19212B"/><text x="40" y="216" font-size="11" font-weight="500" fill="#EFF3F7" text-anchor="middle">3</text><text x="62" y="216" font-size="13" font-weight="400" fill="#435364" text-anchor="start">用户选择复制图片或保存 PNG</text><text x="28" y="260" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="260" font-size="12" font-weight="400" fill="#435364" text-anchor="start">关闭预览返回用量页；是否发送由用户自行决定。</text><text x="28" y="297" font-size="11" font-weight="400" fill="#667785" text-anchor="start">复制失败可改为保存 PNG。</text></svg>