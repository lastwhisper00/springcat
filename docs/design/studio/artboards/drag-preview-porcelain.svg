<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="12 · 拖拽先预览再吸附"><title>drag-preview / 12 · 拖拽先预览再吸附</title><desc>交互提案。Escape 取消拖拽并回到原位置。；拖拽时不触发提醒扩张或悬停摘要。；吸附已有底层能力；自由浮动持久化与取消语义属于提案。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#E8EBEF" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">12 · 拖拽先预览再吸附</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#F0F2F5" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#626C79" text-anchor="middle">交互提案</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">拖动小球或展开面板专用拖动区</text><circle cx="40" cy="140" r="10" fill="#FAFBFC"/><text x="40" y="144" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">越过短距离阈值后进入拖拽，取消点击意图</text><path d="M40 152H40V164" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="176" r="10" fill="#FAFBFC"/><text x="40" y="180" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">2</text><text x="62" y="180" font-size="13" font-weight="400" fill="#435364" text-anchor="start">接近顶部或左右边缘时显示停靠轮廓</text><path d="M40 188H40V200" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="212" r="10" fill="#FAFBFC"/><text x="40" y="216" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">3</text><text x="62" y="216" font-size="13" font-weight="400" fill="#435364" text-anchor="start">松手后沿预览位置吸附并保存当前屏幕位置</text><text x="28" y="260" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="260" font-size="12" font-weight="400" fill="#435364" text-anchor="start">未进入吸附区时以自由浮动形态落位。</text><text x="28" y="297" font-size="11" font-weight="400" fill="#667785" text-anchor="start">Escape 取消拖拽并回到原位置。</text></svg>