<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="03 · 单击直接打开"><title>click-open / 03 · 单击直接打开</title><desc>交互提案。悬停摘要中点击也直接打开。；任务行点击进入同宽短详情；不同时触发外壳收起，长说明进入独立页面。；屏幕放不下时先向内避让，窄屏宽度取可用宽度减两侧安全边距。；高度不足时减少每页任务数量并分页，明确提供上一页、下一页和总数；不能缩小字号、隐藏内容或仅隐藏滚动条。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#E4E7EB" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">03 · 单击直接打开</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#23262B" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#A2AAB5" text-anchor="middle">交互提案</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">点击入口、摘要空白区，或按 Enter / Space</text><circle cx="40" cy="140" r="10" fill="#181A1D"/><text x="40" y="144" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">直接打开逻辑宽 520、左右内边距各 24 的展开面板，不要求先经过摘要态；高度随内容自然决定，五条任务时</text><text x="62" y="164" font-size="13" font-weight="400" fill="#435364" text-anchor="start">约 470</text><path d="M40 152H40V184" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="196" r="10" fill="#181A1D"/><text x="40" y="200" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">2</text><text x="62" y="200" font-size="13" font-weight="400" fill="#435364" text-anchor="start">从当前位置连续展开外壳，每页最多五条同级任务与底部操作同屏，无内部滚动</text><path d="M40 208H40V220" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="232" r="10" fill="#181A1D"/><text x="40" y="236" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">3</text><text x="62" y="236" font-size="13" font-weight="400" fill="#435364" text-anchor="start">阅读区域出现后按导航、任务行、分页与底部入口的顺序键盘访问；超过五条显示上一页、下一页和总数；全部任</text><text x="62" y="256" font-size="13" font-weight="400" fill="#435364" text-anchor="start">务入口进入完整工作台</text><text x="28" y="300" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="300" font-size="12" font-weight="400" fill="#435364" text-anchor="start">入口切换按钮、收起按钮或 Escape 返回常驻形态。</text><text x="28" y="337" font-size="11" font-weight="400" fill="#667785" text-anchor="start">悬停摘要中点击也直接打开。</text></svg>