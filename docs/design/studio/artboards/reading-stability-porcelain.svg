<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="11 · 阅读期间内容稳定"><title>reading-stability / 11 · 阅读期间内容稳定</title><desc>交互提案。紧凑入口的状态汇总与任务列表顺序分离；待确认与其他状态使用相同的行结构。；正在点击的任务不能被新消息挤走。；新任务超出每页五条时更新总数，显示上一页、下一页及当前范围；保留当前页与任务序位，不新增内部滚动区。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#E8EBEF" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">11 · 阅读期间内容稳定</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#F0F2F5" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#626C79" text-anchor="middle">交互提案</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">展开面板打开期间收到任务更新</text><circle cx="40" cy="140" r="10" fill="#FAFBFC"/><text x="40" y="144" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">原位更新状态图标和时间，并依据全部任务刷新运行任务数、不同来源角标与执行外环；当前来源仍在执行时保留</text><text x="62" y="164" font-size="13" font-weight="400" fill="#435364" text-anchor="start"> Logo</text><path d="M40 152H40V184" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="196" r="10" fill="#FAFBFC"/><text x="40" y="200" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">2</text><text x="62" y="200" font-size="13" font-weight="400" fill="#435364" text-anchor="start">新任务通过顶部轻提示告知</text><path d="M40 208H40V220" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="232" r="10" fill="#FAFBFC"/><text x="40" y="236" font-size="11" font-weight="500" fill="#20252C" text-anchor="middle">3</text><text x="62" y="236" font-size="13" font-weight="400" fill="#435364" text-anchor="start">用户主动刷新或重新打开后再按最近更新时间排序，不按状态置顶</text><text x="28" y="280" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="280" font-size="12" font-weight="400" fill="#435364" text-anchor="start">保持当前详情、筛选与页码；独立工作台保留主阅读区滚动位置。</text><text x="28" y="317" font-size="11" font-weight="400" fill="#667785" text-anchor="start">紧凑入口的状态汇总与任务列表顺序分离；待确认与其他状态使用相同的行结构。</text></svg>