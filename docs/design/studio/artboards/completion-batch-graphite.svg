<svg xmlns="http://www.w3.org/2000/svg" width="760" height="405" viewBox="0 0 760 405" role="img" aria-label="10 · 完成提醒合并"><title>completion-batch / 10 · 完成提醒合并</title><desc>交互提案。连续事件更新计数，不反复重新起播。；展开面板已打开时只更新列表，不改变外壳形态。；取消任务进入历史，不伪装为成功完成。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="760" height="405" rx="0" fill="#E4E7EB" stroke="none"/><text x="28" y="40" font-size="23" font-weight="500" fill="#344250" text-anchor="start">10 · 完成提醒合并</text><rect x="28" y="57" width="84" height="24" rx="4" fill="#23262B" stroke="none"/><text x="70" y="73" font-size="11" font-weight="500" fill="#A2AAB5" text-anchor="middle">交互提案</text><text x="28" y="114" font-size="12" font-weight="500" fill="#697785" text-anchor="start">触发</text><text x="81" y="114" font-size="13" font-weight="400" fill="#435364" text-anchor="start">一个或多个任务完成</text><circle cx="40" cy="140" r="10" fill="#181A1D"/><text x="40" y="144" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">1</text><text x="62" y="144" font-size="13" font-weight="400" fill="#435364" text-anchor="start">显示任务标题或多项完成计数</text><path d="M40 152H40V164" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="176" r="10" fill="#181A1D"/><text x="40" y="180" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">2</text><text x="62" y="180" font-size="13" font-weight="400" fill="#435364" text-anchor="start">短暂摘要后回到常驻入口</text><path d="M40 188H40V200" stroke="#BAC5CD" fill="none"/><circle cx="40" cy="212" r="10" fill="#181A1D"/><text x="40" y="216" font-size="11" font-weight="500" fill="#F1F2F4" text-anchor="middle">3</text><text x="62" y="216" font-size="13" font-weight="400" fill="#435364" text-anchor="start">未读数量保留至用户查看或标记已读</text><text x="28" y="260" font-size="12" font-weight="500" fill="#697785" text-anchor="start">收束</text><text x="81" y="260" font-size="12" font-weight="400" fill="#435364" text-anchor="start">完成摘要默认约 5 秒；正在阅读时暂停自动收回。</text><text x="28" y="297" font-size="11" font-weight="400" fill="#667785" text-anchor="start">连续事件更新计数，不反复重新起播。</text></svg>