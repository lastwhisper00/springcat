<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="按钮与组件状态"><title>style-controls / 按钮与组件状态</title><desc>设计规范。按下、悬停、焦点、禁用和错误分别可识别。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="800" height="500" rx="0" fill="#E8EBEF" stroke="none"/><text x="30" y="41" font-size="22" font-weight="500" fill="#344250" text-anchor="start">按钮与组件状态</text><rect x="28" y="76" width="744" height="372" rx="16" fill="#FAFBFC" stroke="none"/><text x="50" y="112" font-size="14" font-weight="500" fill="#20252C" text-anchor="start">轻量操作</text><text x="50" y="150" font-size="13" font-weight="500" fill="#2F5F9D" text-anchor="start">查看请求</text><g transform="translate(111 138) scale(0.5833333333333334)" stroke="#2F5F9D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M6 18 18 6M6 6h12v12"/></g><rect x="155" y="131" width="106" height="28" rx="6" fill="#F0F2F5" stroke="none"/><text x="208" y="150" font-size="13" font-weight="500" fill="#2F5F9D" text-anchor="middle">返回对话</text><rect x="273" y="131" width="106" height="28" rx="6" fill="#F0F2F5" stroke="none"/><text x="326" y="150" font-size="13" font-weight="500" fill="#20252C" text-anchor="middle">重新检测</text><rect x="391" y="131" width="106" height="28" rx="6" fill="#F0F2F5" stroke="none"/><text x="444" y="150" font-size="13" font-weight="500" fill="#20252C" text-anchor="middle">处理中…</text><rect x="509" y="131" width="98" height="28" rx="6" fill="#F0F2F5" stroke="none"/><text x="558" y="150" font-size="13" font-weight="400" fill="#626C79" text-anchor="middle">不可用</text><rect x="617" y="127" width="123" height="36" rx="8" fill="none" stroke="#2F5F9D"/><rect x="621" y="131" width="115" height="28" rx="6" fill="#F0F2F5" stroke="none"/><text x="678.5" y="150" font-size="13" font-weight="500" fill="#20252C" text-anchor="middle">键盘焦点</text><text x="50" y="190" font-size="1