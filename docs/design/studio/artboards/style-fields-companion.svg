<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="字段与特殊状态"><title>style-fields / 字段与特殊状态</title><desc>设计规范。错误原因紧邻字段；禁用与只读使用不同语义。</desc><style>text{font-family:'SpringCat Sans','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif}</style><rect x="0" y="0" width="800" height="500" rx="0" fill="#DEE4EA" stroke="none"/><text x="30" y="41" font-size="22" font-weight="500" fill="#344250" text-anchor="start">字段与特殊状态</text><rect x="28" y="76" width="744" height="372" rx="16" fill="#19212B" stroke="none"/><text x="50" y="111" font-size="16" font-weight="500" fill="#EFF3F7" text-anchor="start">输入与特殊状态</text><text x="50" y="148" font-size="12" font-weight="400" fill="#A5B2C2" text-anchor="start">默认</text><rect x="50" y="160" width="323" height="37" rx="8" fill="#232E3B" stroke="#3B4A5C"/><text x="65" y="184" font-size="13" font-weight="400" fill="#A5B2C2" text-anchor="start">搜索任务标题</text><text x="419" y="148" font-size="12" font-weight="400" fill="#A5B2C2" text-anchor="start">键盘聚焦</text><rect x="415" y="157" width="331" height="43" rx="8" fill="none" stroke="#94B5E0"/><rect x="419" y="161" width="323" height="35" rx="8" fill="#232E3B" stroke="none"/><text x="434" y="184" font-size="13" font-weight="400" fill="#EFF3F7" text-anchor="start">SpringCat</text><text x="50" y="234" font-size="12" font-weight="400" fill="#A5B2C2" text-anchor="start">校验错误</text><rect x="50" y="247" width="323" height="37" rx="8" fill="#232E3B" stroke="#D79DA0"/><text x="65" y="271" font-size="13" font-weight="400" fill="#D79DA0" text-anchor="start">当前目录无法写入</text><text x="50" y="310" font-size="11" font-weight="400" fill="#D79DA0" text-anchor="start">请更换目录或检查写入权限。</text><text x="419" y="234" font-size="12" font-weight="400" fill="#A5B2C2" text-anchor="start">只读</text><rect x="419" y="247" width="323" height="37" rx="8" fill="#232E3B" stroke="#3B4A5C"/><text x="434" y="271" font-size="12" font-weight="400" fill="#A5B2C2" text-anchor="start">由来源工具提供 · 不可编辑</text><rect x="50" y="350" width="133" height="32" rx="8" fill="#3B4A5C" stroke="none"/><text x="116" y="372" font-size="12" font-weight="500" fill="#EFF3F7" text-anchor="middle">按钮按下</text><text x="213" y="371" font-size="12" font-weight="400" fill="#A5B2C2" text-anchor="start">只读任务仅提供“返回原对话”，不显示伪授权按钮。</text></svg>