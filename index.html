<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpringCat</title>
    <style>
      html,
      body {
        background: transparent;
      }
      html.settings,
      html.settings body {
        background: Canvas;
      }
    </style>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const settings =
          location.hash === "#settings" || params.get("window") === "settings";
        const panelMenu =
          location.hash === "#panel-menu" || params.get("window") === "panel-menu";
        document.documentElement.classList.add(
          settings ? "settings" : panelMenu ? "panel-menu" : "overlay",
        );
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
