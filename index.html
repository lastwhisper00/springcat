<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpringCat</title>
    <style>
      html,
      body {
        background: transparent;
      }
      html.settings,
      html.settings body {
        background: Canvas;
      }
    </style>
    <script>
      const settings =
        location.hash === "#settings" || /[?&]window=settings/.test(location.search);
      document.documentElement.classList.add(settings ? "settings" : "overlay");
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
